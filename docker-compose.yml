services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: flower-show-kafka
    hostname: flower-show-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://flower-show-kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@flower-show-kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - flower_show_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    container_name: flower-show-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flower_show
      POSTGRES_USER: flower_show
      POSTGRES_PASSWORD: flower_show
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flower_show_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower_show -d flower_show"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: flower-show-ollama
    profiles:
      - semantic
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - flower_show_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-model:
    image: ollama/ollama:latest
    profiles:
      - semantic
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-embedding:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]

  minio:
    image: minio/minio:latest
    container_name: flower-show-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flower_show_minio
      MINIO_ROOT_PASSWORD: flower_show_minio_123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - D:/flower-show-data/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 flower_show_minio flower_show_minio_123; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/flower-show-media;
      mc anonymous set download local/flower-show-media;
      "

  minio-client:
    image: minio/mc:latest
    profiles:
      - tools
    depends_on:
      - minio
    entrypoint: /bin/sh

  nginx:
    image: nginx:1.27-alpine
    container_name: flower-show-nginx
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flower-show-cloudflared
    profiles:
      - tunnel
    depends_on:
      - nginx
    command: tunnel --no-autoupdate --protocol http2 --url http://nginx:8088

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: flower-show-cloudflared-named
    profiles:
      - named-tunnel
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --protocol http2 run
    restart: unless-stopped

volumes:
  flower_show_postgres_data:
  flower_show_kafka_data:
  flower_show_ollama_data:
