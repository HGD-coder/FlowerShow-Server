server {
    listen 8088;
    server_name _;

    client_max_body_size 1024m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "flower-show-gateway UP\n";
    }

    location ^~ /api/v1/import/ {
        return 403;
    }

    location = /ws/chat {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://host.docker.internal:8090;
    }

    location ^~ /api/v1/chat/ {
        client_max_body_size 64k;

        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Install-Id $http_x_install_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://host.docker.internal:8080;
    }

    location ~ ^/api/v1/(feed/pages|search/guesses|search/videos|events:batch)$ {
        client_max_body_size 64k;

        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Install-Id $http_x_install_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://host.docker.internal:8080;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Install-Id $http_x_install_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://host.docker.internal:8080/api/;
    }

    location /media/ {
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://minio:9000/flower-show-media/;

        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
